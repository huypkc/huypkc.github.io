# The visible copy, the schema.org JSON-LD and llms.txt have to say the same
# things. Nothing installs; the check is standard-library Python.
name: discovery

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/discovery-check.py
      # The timeline, the homepage entry point that counts it, and the
      # evidence appendix are all generated from data/ and committed. This
      # fails if any of them has drifted from its data.
      - run: python3 tool/render-timeline.py --check
